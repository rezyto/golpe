<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GOLPE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>GOLPE</title>
<style>
:root{--bg:#14161b;--panel:#1d2027;--line:#2c313b;--txt:#ecebe6;--dim:#9a9ca3;--gold:#e8b931;--red:#e0483e;--ok:#3cc48a;--blue:#4a8fe0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;cursor:pointer}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;align-items:flex-start;gap:10px}
.chip{background:rgba(20,22,27,.78);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;backdrop-filter:blur(4px)}
#money{color:var(--gold);font-size:16px}
#lvlbox{min-width:110px}
#lvl{font-size:12px;color:var(--dim)}
.bar{height:5px;background:#2b2f37;border-radius:3px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--gold);width:0}
#hpbar>i{background:var(--ok)}
#carbar>i{background:var(--blue)}
#stars{flex:1;text-align:center;font-size:22px;letter-spacing:2px;color:#444a55;text-shadow:0 1px 2px #000}
#stars b{color:var(--gold)}
#stars.flash b{color:var(--red)}
#right{display:flex;gap:8px;align-items:flex-start}
#menuBtn{pointer-events:auto;width:40px;height:40px;border-radius:10px;background:rgba(20,22,27,.85);border:1px solid var(--line);font-size:20px}
#zoneName{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 46px);left:50%;transform:translateX(-50%);font-size:12px;color:var(--dim);background:rgba(20,22,27,.6);padding:3px 10px;border-radius:8px}
#prog{position:absolute;top:28%;left:50%;transform:translateX(-50%);width:min(320px,70vw);text-align:center}
#prog .lab{font-weight:800;font-size:15px;text-shadow:0 1px 3px #000;margin-bottom:6px}
#prog .bar{height:10px;border:1px solid #000}
#prog.red .bar>i{background:var(--red)}
#btns{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:14px;align-items:flex-end;pointer-events:auto}
.rb{width:78px;height:78px;border-radius:50%;background:rgba(29,32,39,.85);border:2px solid var(--line);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;line-height:1.1}
#bFire{width:92px;height:92px;border-color:#6b2a25;background:rgba(80,24,20,.8);font-size:14px}
#bAct.on{border-color:var(--gold);color:var(--gold)}
#bAct.off{opacity:.35}
#hint{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));font-size:11px;color:var(--dim);max-width:200px}
#toasts{position:fixed;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 100px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:6px;align-items:center;pointer-events:none;z-index:60}
.toast{background:rgba(20,22,27,.92);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;animation:tin .25s ease-out;max-width:86vw;text-align:center}
.toast.g{border-color:var(--gold)}.toast.r{border-color:var(--red)}.toast.o{border-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,11,14,.82);display:flex;align-items:center;justify-content:center;z-index:30;padding:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:18px}
.x{width:36px;height:36px;border-radius:9px;background:#2a2e37;font-size:18px}
.pb{padding:12px 16px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.pb h3{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.sub{color:var(--dim);font-style:italic;margin:0 0 8px;font-size:14px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #252932}
.row .n{flex:1;min-width:0}
.row .n b{display:block;font-size:14px}
.row .n small{color:var(--dim);font-size:12px}
.btn{background:#2f3440;border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.btn.g{background:var(--gold);color:#1a1a1a}
.btn.o{background:var(--ok);color:#0e2219}
.btn.r{background:var(--red)}
.btn:disabled{opacity:.35}
.big{width:100%;padding:12px;margin-top:10px;font-size:15px}
.dim{color:var(--dim);font-size:13px}
/* map */
#map .panel{width:min(900px,100%);height:min(560px,100%)}
#mapArea{position:relative;flex:1;margin:10px;border-radius:12px;overflow:hidden;background:
 radial-gradient(circle at 8% 95%,#1f4c6b 0 18%,transparent 18.5%),
 radial-gradient(circle at 100% 0%,#1f4c6b 0 14%,transparent 14.5%),
 linear-gradient(135deg,#2c3a2e,#323b33 50%,#2b3530)}
#mapArea svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;padding:0}
.node .ic{width:48px;height:48px;border-radius:50%;background:#1d2027;border:2px solid #555b66;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.node .nm{font-size:11px;font-weight:700;background:rgba(20,22,27,.85);padding:2px 6px;border-radius:6px;white-space:nowrap}
.node .st{font-size:10px;color:var(--dim)}
.node.heist .ic{border-color:var(--red)}
.node.shop .ic{border-color:var(--gold)}
.node.terr .ic{border-color:#9a6ad0}
.node.home .ic{border-color:var(--ok)}
.node.lock{opacity:.45}
.node.mis .ic{box-shadow:0 0 0 4px rgba(232,185,49,.5),0 3px 8px rgba(0,0,0,.5)}
.node.own .ic{background:#3a2a52}
/* login */
#login{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:
 radial-gradient(ellipse at 50% 120%,rgba(224,72,62,.35),transparent 60%),
 repeating-linear-gradient(90deg,#16181d 0 60px,#181b21 60px 120px),var(--bg);padding:20px}
.logo{font-size:clamp(56px,14vw,96px);font-weight:900;letter-spacing:.12em;color:var(--gold);text-shadow:4px 4px 0 #6b1f1a,0 0 30px rgba(232,185,49,.25);transform:skew(-6deg)}
.tag{color:var(--dim);margin-top:-6px;font-size:14px}
#nick{background:#1d2027;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--txt);font-size:16px;width:min(300px,80vw);text-align:center;user-select:text;-webkit-user-select:text}
#playBtn{width:min(300px,80vw);padding:14px;border-radius:12px;background:var(--gold);color:#1a1a1a;font-weight:900;font-size:18px;letter-spacing:.1em}
#upd{font-size:13px;color:var(--dim);text-align:center;min-height:18px}
#upd a{color:var(--gold)}
#ver{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));right:14px;font-size:12px;color:#5d616b}
#travel{position:fixed;inset:0;background:#0d0e11;z-index:45;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--gold);transition:opacity .3s}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="top">
    <div class="chip" id="money">$0</div>
    <div class="chip" id="lvlbox"><div id="lvl">Nível 1</div><div class="bar" id="xpbar"><i></i></div></div>
    <div id="stars"></div>
    <div id="right">
      <div class="chip" style="min-width:96px"><div style="font-size:11px;color:var(--dim)" id="bagtxt">Mochila 0/10kg</div><div class="bar" id="hpbar"><i></i></div><div class="bar" id="carbar"><i></i></div></div>
      <button id="menuBtn">☰</button>
    </div>
  </div>
  <div id="zoneName"></div>
  <div id="prog" class="hidden"><div class="lab"></div><div class="bar"><i></i></div></div>
  <div id="hint">Joystick: toca e arrasta no lado esquerdo · PC: WASD, E ação, Espaço disparar</div>
  <div id="btns"><button class="rb off" id="bAct">—</button><button class="rb" id="bFire">DISPARAR</button></div>
</div>

<div id="toasts"></div>

<div id="map" class="ov hidden">
  <div class="panel">
    <div class="ph"><h2>🗺️ Vila Rubra — para onde vais?</h2><span class="dim" id="mapInfo"></span></div>
    <div id="mapArea"></div>
  </div>
</div>

<div id="modal" class="ov hidden">
  <div class="panel"><div class="ph"><h2 id="mTitle"></h2><button class="x" id="mClose">✕</button></div><div class="pb" id="mBody"></div></div>
</div>

<div id="login">
  <div class="logo">GOLPE</div>
  <div class="tag">Vila Rubra · crime em mundo aberto</div>
  <input id="nick" placeholder="Nome de jogador" maxlength="16" autocomplete="off">
  <button id="playBtn">JOGAR</button>
  <div id="upd">A procurar atualizações…</div>
  <div id="ver"></div>
</div>

<div id="travel" class="hidden">A caminho…</div>

<script>
(()=>{
'use strict';
const GAME_VERSION='0.1.0';
const REMOTE_BASE='https://rezyto.github.io/golpe/';
const ON_PAGES=location.hostname.endsWith('github.io');
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,ZOOM=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ZOOM=Math.max(.55,Math.min(1.05,Math.min(W,H)/600));}
addEventListener('resize',resize);resize();

/* ---------- utils ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};
const fmt=n=>'$'+Math.floor(n).toLocaleString('pt-PT');
function seeded(seed){let s=7;for(const ch of seed)s=(s*31+ch.charCodeAt(0))>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=p<0?0:255,t=Math.abs(p);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);return`rgb(${r},${g},${b})`;}
function cmpVer(a,b){const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)>(y[i]||0))return 1;if((x[i]||0)<(y[i]||0))return -1;}return 0;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- dados do jogo (tudo original) ---------- */
const WEAPONS=[
 {id:'p22',name:'Pistola Rato .22',price:0,dmg:10,rate:.45,range:260,pel:1,spr:.04,lvl:1},
 {id:'p9',name:'Pistola Vigia 9mm',price:1500,dmg:16,rate:.35,range:300,pel:1,spr:.03,lvl:2},
 {id:'smg',name:'SMG Vespa',price:6000,dmg:9,rate:.11,range:280,pel:1,spr:.09,lvl:3},
 {id:'sg',name:'Caçadeira Tróia',price:9000,dmg:9,rate:.8,range:190,pel:6,spr:.25,lvl:4},
 {id:'rf',name:'Espingarda Falcão',price:20000,dmg:45,rate:.9,range:450,pel:1,spr:.01,lvl:6},
];
const CARS=[
 {id:'pardal',name:'Pardal',price:0,spd:280,hp:100,col:'#d9a441',lvl:1,d:'Pequeno e fiável'},
 {id:'mula',name:'Furgão Mula',price:4000,spd:250,hp:190,col:'#7d8a96',lvl:2,d:'Lento mas aguenta pancada'},
 {id:'lince',name:'Lince GT',price:12000,spd:380,hp:120,col:'#c0392b',lvl:4,d:'O mais rápido da cidade'},
 {id:'touro',name:'Touro 4x4',price:25000,spd:330,hp:280,col:'#2e6b4f',lvl:6,d:'Rápido e blindado'},
];
const BAGS=[
 {id:'b10',name:'Mochila',price:0,cap:10,lvl:1},
 {id:'b20',name:'Saco desportivo',price:1200,cap:20,lvl:1},
 {id:'b35',name:'Mala de viagem',price:5000,cap:35,lvl:3},
 {id:'b60',name:'Saco de lona XL',price:15000,cap:60,lvl:5},
];
const PROPS=[
 {id:'quiosque',name:'Quiosque da Praça',price:3000,rent:40,lvl:1},
 {id:'t1',name:'Apartamento T1',price:10000,rent:150,lvl:2},
 {id:'loja',name:'Loja de rua',price:25000,rent:400,lvl:4},
 {id:'predio',name:'Prédio inteiro',price:80000,rent:1400,lvl:6},
];
const HEISTS={
 cafe:{name:'Café Central',lvl:1,time:6,cd:120,stars:1,xp:25,col:'#8a5a34',alarm:.2,cash:[80,200],
  loot:[{n:'Máquina de café',kg:6,v:250,ch:.45},{n:'Garrafa de licor',kg:1,v:60,ch:.8,q:[1,3]},{n:'Telemóvel do balcão',kg:.3,v:120,ch:.4}]},
 bomba:{name:'Bomba Estrela',lvl:1,time:8,cd:180,stars:2,xp:40,col:'#b23b2e',alarm:.35,cash:[150,350],
  loot:[{n:'Maço de tabaco',kg:.2,v:35,ch:.9,q:[3,8]},{n:'Bateria de carro',kg:8,v:180,ch:.4},{n:'Raspadinhas',kg:.1,v:50,ch:.6,q:[2,6]}]},
 hotel:{name:'Hotel Atlântida',lvl:3,time:12,cd:300,stars:3,xp:90,col:'#3d5f8a',alarm:.5,cash:[400,900],
  loot:[{n:'Relógio de pulso',kg:.3,v:600,ch:.7,q:[1,2]},{n:'Portátil',kg:2,v:900,ch:.6},{n:'Joias',kg:.2,v:1200,ch:.45},{n:'Garrafa de champanhe',kg:1.5,v:200,ch:.6,q:[1,3]}]},
 museu:{name:'Museu da Cidade',lvl:5,time:18,cd:480,stars:4,xp:200,col:'#c9b98f',alarm:.8,cash:[0,0],
  loot:[{n:'Estatueta de bronze',kg:7,v:3500,ch:.6},{n:'Pintura antiga',kg:4,v:6000,ch:.5},{n:'Vaso cerâmico',kg:5,v:2500,ch:.6},{n:'Moeda rara',kg:.1,v:1500,ch:.8,q:[1,3]}]},
};
const TERRS={
 t_docas:{name:'Docas',lvl:2,gang:4,income:60,col:'#5b4a7a'},
 t_velho:{name:'Bairro Velho',lvl:4,gang:6,income:140,col:'#7a4a4a'},
 t_ind:{name:'Zona Industrial',lvl:6,gang:9,income:300,col:'#4a6a7a'},
};
const SHOPS={
 home:{name:'Esconderijo',col:'#4a4f3c'},
 bar:{name:'Bar O Farol',col:'#2f6d5c'},
 armeiro:{name:'Armeiro do Lima',col:'#55505a'},
 stand:{name:'Stand Rodas Livres',col:'#a8742c'},
 imob:{name:"Imobiliária Chave d'Ouro",col:'#7c6a3a'},
};
const MAPNODES=[
 {id:'home',x:12,y:50,ic:'🏚️'},{id:'bar',x:26,y:80,ic:'🍺'},{id:'cafe',x:30,y:26,ic:'☕'},
 {id:'armeiro',x:44,y:63,ic:'🔫'},{id:'bomba',x:52,y:16,ic:'⛽'},{id:'stand',x:62,y:84,ic:'🚗'},
 {id:'hotel',x:66,y:44,ic:'🏨'},{id:'imob',x:80,y:20,ic:'🏠'},{id:'museu',x:88,y:60,ic:'🏛️'},
 {id:'t_docas',x:13,y:14,ic:'⚓'},{id:'t_velho',x:43,y:38,ic:'🏘️'},{id:'t_ind',x:86,y:87,ic:'🏭'},
];
const kindOf=id=>HEISTS[id]?'heist':TERRS[id]?'terr':id==='home'?'home':'shop';
const defOf=id=>HEISTS[id]||TERRS[id]||SHOPS[id];
const BPAL=['#6b6f7a','#7a6a5a','#5d6b78','#8a7f6a','#6a5a6e','#5f7466','#857066','#6e7580'];

/* ---------- gravação ---------- */
const DEF=()=>({nick:'',money:500,xp:0,lvl:1,hp:100,weapon:'p22',weapons:['p22'],car:'pardal',cars:['pardal'],carHp:100,bag:'b10',bags:['b10'],props:{},terr:{},inv:[],cds:{},pending:0,last:Date.now(),mission:null,stats:{heists:0,busted:0,earned:0,hospital:0}});
let S=DEF();
function load(){try{const r=localStorage.getItem('golpe_save');if(r)S=Object.assign(DEF(),JSON.parse(r));}catch(e){}}
function save(){S.last=Date.now();try{localStorage.setItem('golpe_save',JSON.stringify(S));}catch(e){}}
const W_=()=>WEAPONS.find(w=>w.id===S.weapon)||WEAPONS[0];
const C_=()=>CARS.find(c=>c.id===S.car)||CARS[0];
const B_=()=>BAGS.find(b=>b.id===S.bag)||BAGS[0];
const invKg=()=>S.inv.reduce((a,i)=>a+i.kg,0);
const incomeRate=()=>PROPS.reduce((a,p)=>a+(S.props[p.id]&&S.props[p.id].rented?p.rent:0),0)+Object.keys(TERRS).reduce((a,t)=>a+(S.terr[t]?TERRS[t].income:0),0);
const xpNeed=l=>100*l;
const terrBonus=()=>1+0.05*Object.keys(S.terr).length;
function addXP(n){S.xp+=n;while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;toast(`⬆️ Subiste para o nível ${S.lvl}!`,'g');}}
function addMoney(n){S.money+=n;if(n>0)S.stats.earned+=n;}

/* ---------- toasts ---------- */
function toast(t,c=''){const d=document.createElement('div');d.className='toast '+c;d.textContent=t;$('#toasts').appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .4s';setTimeout(()=>d.remove(),400);},2600);while($('#toasts').children.length>4)$('#toasts').firstChild.remove();}

/* ---------- estado de jogo ---------- */
let mode='login',Z=null,car=null,police=[],gang=[],bullets=[],parts=[];
const P={x:0,y:0,ang:0,inCar:false,fireCd:0,hurt:0};
let wanted=0,lostT=0,heist=null,bust=0,cap=0,spawnT=0,time=0,camX=0,camY=0;

/* ---------- zonas ---------- */
function makeZone(id){
 const r=seeded(id),kind=kindOf(id),def=defOf(id);
 const zw=1800,zh=1300,RW=55,rx=[300,1250],ry=[260,900];
 const z={id,kind,def,w:zw,h:zh,RW,rx,ry,blocks:[],lots:[],trees:[],door:null,flag:null,armed:false};
 const xs=[[0,rx[0]-RW],[rx[0]+RW,rx[1]-RW],[rx[1]+RW,zw]],ys=[[0,ry[0]-RW],[ry[0]+RW,ry[1]-RW],[ry[1]+RW,zh]];
 for(let i=0;i<3;i++)for(let j=0;j<3;j++){
  const lot={x:xs[i][0],y:ys[j][0],w:xs[i][1]-xs[i][0],h:ys[j][1]-ys[j][0]};z.lots.push(lot);
  const bx=lot.x+28,by=lot.y+28,bw=lot.w-56,bh=lot.h-56;
  if(i===1&&j===1){
   if(kind==='terr'){
    z.plaza={x:bx,y:by,w:bw,h:bh};z.flag={x:bx+bw/2,y:by+bh/2};
    for(let k=0;k<7;k++){const cx=bx+40+r()*(bw-120),cy=by+40+r()*(bh-100);if(Math.hypot(cx-z.flag.x,cy-z.flag.y)<110)continue;z.blocks.push({x:cx,y:cy,w:50+r()*40,h:34+r()*30,col:'#6d5a3e',crate:true});}
   }else{
    const tw=Math.min(bw,kind==='heist'&&id==='museu'?600:500),th=Math.min(bh,340),tx=bx+(bw-tw)/2,ty=by+30;
    z.blocks.push({x:tx,y:ty,w:tw,h:th,col:def.col,label:def.name,main:true});
    z.door={x:tx+tw/2,y:ty-8};
    for(let k=0;k<6;k++)z.trees.push({x:bx+20+r()*(bw-40),y:ty+th+30+r()*Math.max(10,bh-th-60),r:14+r()*10});
   }
   continue;
  }
  let cx=bx;
  while(cx<bx+bw-50){
   const w=Math.min(bx+bw-cx,90+r()*170);if(w<50)break;
   const h=bh*(.5+r()*.5),y=r()<.5?by:by+bh-h;
   z.blocks.push({x:cx,y,w:w-16,h,col:BPAL[Math.floor(r()*BPAL.length)]});
   if(r()<.6)z.trees.push({x:cx+w/2,y:y===by?by+h+20:y-20,r:12+r()*8});
   cx+=w;
  }
 }
 // filtra árvores que caem dentro de prédios
 z.trees=z.trees.filter(t=>!z.blocks.some(b=>t.x>b.x-8&&t.x<b.x+b.w+8&&t.y>b.y-8&&t.y<b.y+b.h+8));
 return z;
}
function rectOf(b){return b;}
function pushOut(o,rad){
 let hit=false;
 for(const b of Z.blocks){
  const cx=clamp(o.x,b.x,b.x+b.w),cy=clamp(o.y,b.y,b.y+b.h),dx=o.x-cx,dy=o.y-cy,d2=dx*dx+dy*dy;
  if(d2<rad*rad){
   hit=true;
   if(d2>0.0001){const d=Math.sqrt(d2);o.x=cx+dx/d*rad;o.y=cy+dy/d*rad;}
   else{const l=o.x-b.x,rr=b.x+b.w-o.x,t=o.y-b.y,bb=b.y+b.h-o.y,m=Math.min(l,rr,t,bb);
    if(m===l)o.x=b.x-rad;else if(m===rr)o.x=b.x+b.w+rad;else if(m===t)o.y=b.y-rad;else o.y=b.y+b.h+rad;}
  }
 }
 return hit;
}
const inBlock=(x,y)=>Z.blocks.some(b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h);

function inputVec(){
 let x=0,y=0;
 if(keys.KeyA||keys.ArrowLeft)x-=1;if(keys.KeyD||keys.ArrowRight)x+=1;if(keys.KeyW||keys.ArrowUp)y-=1;if(keys.KeyS||keys.ArrowDown)y+=1;
 if(joy){const dx=joy.x-joy.bx,dy=joy.y-joy.by,m=Math.hypot(dx,dy),R=60;if(m>6){x=dx/Math.max(m,R)*Math.min(1,m/R)*(m>R?1:1);y=dy/Math.max(m,R);if(m<R){x=dx/R;y=dy/R;}else{x=dx/m;y=dy/m;}}}
 const m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}return{x,y};
}

/* ---------- carros ---------- */
function drive(c,ix,iy,dt,max){
 const m=Math.hypot(ix,iy);
 if(m>.15){
  const ta=Math.atan2(iy,ix),da=angDiff(ta,c.ang),turn=3.4*dt*Math.min(1,Math.abs(c.spd)/90+.45);
  c.ang+=clamp(da,-turn,turn);
  const tgt=max*m*(Math.abs(da)>1.6?.45:1);
  c.spd+=(tgt-c.spd)*Math.min(1,dt*1.7);
 }else c.spd*=Math.pow(.12,dt);
 c.x+=Math.cos(c.ang)*c.spd*dt;c.y+=Math.sin(c.ang)*c.spd*dt;
 if(pushOut(c,19))c.spd*=.55;
 c.x=clamp(c.x,4,Z.w-4);c.y=clamp(c.y,4,Z.h-4);
}

function ctxAction(){

 if(!P.inCar&&Z.door&&dist(P,Z.door)<60){
  if(Z.kind==='heist'){
   if(heist)return{l:'A ASSALTAR…',off:true};
   const left=(S.cds[Z.id]||0)-Date.now();
   if(left>0)return{l:'FECHADO '+mmss(left),off:true};
   return{l:'ASSALTAR',f:startHeist};
  }
  return{l:'ENTRAR',f:()=>openShop(Z.id)};
 }
 if(!P.inCar&&car&&S.carHp>0&&dist(P,car)<65)return{l:'CONDUZIR',f:()=>{P.inCar=true;}};
 if(P.inCar)return{l:'SAIR DO CARRO',f:exitCar};
 if(Z.kind==='terr'&&!S.terr[Z.id]&&gang.length===0&&dist(P,Z.flag)<60)return{l:'A TOMAR…',off:true};
 return null;
}

 if(h.cash[1]>0){const v=rndi(h.cash[0],h.cash[1]);add({n:'Dinheiro sujo',kg:Math.max(.1,+(v/1000).toFixed(2)),v,dirty:true});}
 for(const L of h.loot)if(Math.random()<L.ch){const q=L.q?rndi(L.q[0],L.q[1]):1;for(let k=0;k<q;k++)add({n:L.n,kg:L.kg,v:L.v});}
 if(!got.length&&!lost)add({n:h.loot[0].n,kg:h.loot[0].kg,v:h.loot[0].v});
 const val=got.reduce((a,i)=>a+i.v,0);
 toast(`💰 Saque: ${got.length} itens (${fmt(val)})`,'g');
 if(lost)toast(`🎒 Mochila cheia — ficaram ${lost} itens para trás`,'r');
 wanted=Math.min(5,wanted+h.stars);lostT=0;

 if(S.mission&&S.mission.target===Z.id&&!S.mission.done){S.mission.done=true;toast('📞 Contrato cumprido! Vai ao Bar O Farol','g');}
 save();
}

 const w=W_();let tgt=null,best=w.range;

 const a=tgt?Math.atan2(tgt.y-P.y,tgt.x-P.x):P.ang;
 if(!P.inCar)P.ang=a;
 for(let i=0;i<w.pel;i++)fire(P.x+Math.cos(a)*14,P.y+Math.sin(a)*14,a+rnd(-w.spr,w.spr),'p',w.dmg,w.range/720);
 P.fireCd=w.rate;
 for(let i=0;i<3;i++)parts.push({x:P.x+Math.cos(a)*16,y:P.y+Math.sin(a)*16,vx:Math.cos(a)*rnd(60,160)+rnd(-40,40),vy:Math.sin(a)*rnd(60,160)+rnd(-40,40),life:.12,col:'#ffd56a',r:2.5});
 if(Z.kind==='heist'&&wanted===0){wanted=1;lostT=0;toast('🔫 Tiros ouvidos — polícia a caminho','r');}
}
function boom(x,y,col='#ff8a3a',n=18){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(40,220);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.3,.7),col,r:rnd(2,5)});}}

 else{S.hp-=d;P.hurt=.15;if(S.hp<=0){S.hp=0;hospital();}}
}
function spawnPolice(){

 const ok=pts.filter(p=>dist(p,P)>480);const p=(ok.length?ok:pts)[Math.floor(Math.random()*(ok.length||pts.length))];

/* ---------- update ---------- */
let lastAct='';
function update(dt){
 time+=dt;
 // rendimento passivo
 const rate=incomeRate();if(rate>0)S.pending+=rate*dt/60;
 if(mode!=='play')return;
 const iv=inputVec();
 const cd=C_();
 if(P.inCar){drive(car,iv.x,iv.y,dt,cd.spd);P.x=car.x;P.y=car.y;P.ang=car.ang;}
 else{
  P.x+=iv.x*155*dt;P.y+=iv.y*155*dt;if(Math.hypot(iv.x,iv.y)>.1&&!firing)P.ang=Math.atan2(iv.y,iv.x);
  pushOut(P,10);P.x=clamp(P.x,2,Z.w-2);P.y=clamp(P.y,2,Z.h-2);
 }
 if(P.hurt>0)P.hurt-=dt;
 // saída da zona
 if(!Z.armed&&dist(P,Z.spawn)>160)Z.armed=true;
 if(Z.armed&&(P.x<14||P.y<14||P.x>Z.w-14||P.y>Z.h-14)){leaveZone();return;}
 // disparar
 P.fireCd-=dt;if(firing&&P.fireCd<=0)shoot();
 // assalto
 if(heist){
  if(P.inCar||dist(P,Z.door)>75){heist=null;toast('Assalto interrompido','r');}
  else{heist.t+=dt;if(heist.t>=heist.need)finishHeist();}
 }
 // polícia
 const target=[0,1,2,3,4,6][wanted];
 if(police.length<target){spawnT-=dt;if(spawnT<=0){spawnPolice();spawnT=2.2;}}
 if(wanted===0&&police.length){police=[];}
 let seen=false,near=false;
 for(const p of police){
  const dx=P.x-p.x,dy=P.y-p.y,d=Math.hypot(dx,dy)||1;
  if(d<460)seen=true;
  if(p.rev>0){p.rev-=dt;p.spd=-120;p.ang+=1.9*dt*p.rd;p.x+=Math.cos(p.ang)*p.spd*dt;p.y+=Math.sin(p.ang)*p.spd*dt;pushOut(p,19);}
  else{
   const slow=!P.inCar&&d<130?.3:1;
   drive(p,dx/d,dy/d,dt,(225+wanted*28)*slow);
   if(Math.abs(p.spd)<25&&d>60){p.stuck+=dt;if(p.stuck>.8){p.rev=.7;p.stuck=0;p.rd=Math.random()<.5?-1:1;}}else p.stuck=0;
  }
  if(wanted>=2){p.cd-=dt;if(p.cd<=0&&d<270){fire(p.x,p.y,Math.atan2(dy,dx)+rnd(-.12,.12),'e',5,.4);p.cd=Math.max(.45,1.2-wanted*.12);}}
  p.hitCd-=dt;
  if(d<40){
   const ov=40-d;p.x-=dx/d*ov*.6;p.y-=dy/d*ov*.6;
   if(P.inCar){car.x+=dx/d*ov*.4;car.y+=dy/d*ov*.4;
    if(p.hitCd<=0){const rel=Math.abs(car.spd)+Math.abs(p.spd);hurtPlayer(4+rel*.03);p.hp-=6+Math.abs(car.spd)*.08;p.hitCd=.5;car.spd*=.5;boom((p.x+car.x)/2,(p.y+car.y)/2,'#ffd56a',6);}}
   else if(Math.abs(p.spd)<160)near=true;
  }
 }
 if(near){bust+=dt;if(bust>=2){bust=0;busted();return;}}else bust=Math.max(0,bust-dt*1.5);
 police=police.filter(p=>{if(p.hp<=0){boom(p.x,p.y);addXP(15);if(wanted<5){wanted++;toast('⭐ Abateste uma patrulha — mais calor!','r');}return false;}return true;});
 if(wanted>0){if(!seen){lostT+=dt;if(lostT>8){wanted--;lostT=0;if(wanted===0)toast('😮‍💨 Despistaste a polícia','o');}}else lostT=0;}
 // gangue
 for(const g of gang){
  const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy)||1;g.ang=Math.atan2(dy,dx);
  if(d<380){if(d>170){g.x+=dx/d*85*dt;g.y+=dy/d*85*dt;}g.cd-=dt;if(g.cd<=0){fire(g.x,g.y,g.ang+rnd(-.15,.15),'e',6,.42);g.cd=rnd(.9,1.5);}}
  pushOut(g,10);
 }
 gang=gang.filter(g=>{if(g.hp<=0){boom(g.x,g.y,'#b04040',10);addXP(10);return false;}return true;});
 if(Z.kind==='terr'&&!S.terr[Z.id]){
  if(gang.length===0&&!Z.cleared){Z.cleared=true;toast('🏴 Gangue eliminado! Fica junto à bandeira para tomar o território','g');}
  if(gang.length===0&&!P.inCar&&dist(P,Z.flag)<60){cap+=dt;if(cap>=3){S.terr[Z.id]=true;cap=0;addXP(120);toast(`🚩 ${TERRS[Z.id].name} é teu! +${fmt(TERRS[Z.id].income)}/min`,'g');$('#zoneName').textContent=Z.def.name+' · teu território';save();}}else cap=Math.max(0,cap-dt);
 }
 // balas
 for(const b of bullets){
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  if(inBlock(b.x,b.y)){b.life=0;parts.push({x:b.x,y:b.y,vx:0,vy:0,life:.15,col:'#ccc',r:3});continue;}
  if(b.from==='p'){for(const t of police.concat(gang)){const rr=t.spd!==undefined?22:12;if(Math.hypot(t.x-b.x,t.y-b.y)<rr){t.hp-=b.dmg;b.life=0;parts.push({x:b.x,y:b.y,vx:0,vy:0,life:.15,col:'#ffeb99',r:4});break;}}}
  else if(Math.hypot(P.x-b.x,P.y-b.y)<(P.inCar?20:12)){hurtPlayer(b.dmg);b.life=0;}
 }
 bullets=bullets.filter(b=>b.life>0);
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92;p.life-=dt;}
 parts=parts.filter(p=>p.life>0);
 if(wanted===0&&S.hp<100)S.hp=Math.min(100,S.hp+3*dt);
 // UI contextual
 const a=ctxAction(),lab=a?a.l:'—';
 if(lab!==lastAct){lastAct=lab;bAct.textContent=lab;bAct.className='rb '+(a&&!a.off?'on':'off');}
}

}

 ctx.fillStyle='rgba(0,0,0,.35)';rr(-21,-9,46,24,6);ctx.fill();
 ctx.fillStyle=col;rr(-23,-12,46,24,6);ctx.fill();
 ctx.fillStyle=shade(col.startsWith('#')?col:'#888888',-.25);rr(-23,-12,46,24,6);ctx.fill();
 ctx.fillStyle=col;rr(-21,-10,42,20,5);ctx.fill();
 ctx.fillStyle='#1c2430';rr(2,-8,10,16,3);ctx.fill();rr(-16,-8,7,16,3);ctx.fill();
 ctx.fillStyle='#fff6c8';ctx.fillRect(20,-9,3,5);ctx.fillRect(20,4,3,5);
 if(pol){const on=Math.floor(time*8)%2;ctx.fillStyle=on?'#ff3b3b':'#3b7bff';ctx.fillRect(-6,-9,5,8);ctx.fillStyle=on?'#3b7bff':'#ff3b3b';ctx.fillRect(-6,1,5,8);}

 ctx.fillStyle=shade(col,-.35);ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();
 ctx.strokeStyle='#222';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+Math.cos(ang)*6,y+Math.sin(ang)*6);ctx.lineTo(x+Math.cos(ang)*17,y+Math.sin(ang)*17);ctx.stroke();
}

 {const vw=W/ZOOM,vh=H/ZOOM;camX=vw>=Z.w?(Z.w-vw)/2:clamp(P.x-vw/2,0,Z.w-vw);camY=vh>=Z.h?(Z.h-vh)/2:clamp(P.y-vh/2,0,Z.h-vh);}

 ctx.strokeStyle='#d6c36a';ctx.lineWidth=3;ctx.setLineDash([26,22]);ctx.beginPath();

 ctx.fillStyle='#e9e6dc';for(const x of Z.rx)for(const y of Z.ry){for(let k=-3;k<=3;k++){ctx.fillRect(x+k*14-4,y-RW-22,8,18);ctx.fillRect(x+k*14-4,y+RW+4,8,18);}}
 // saídas

 // bandeira / porta
 if(Z.flag){const own=S.terr[Z.id];ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.arc(Z.flag.x,Z.flag.y,60,0,7);ctx.fill();
  ctx.strokeStyle=own?'#3cc48a':'#9a6ad0';ctx.lineWidth=3;ctx.beginPath();ctx.arc(Z.flag.x,Z.flag.y,60,-Math.PI/2,-Math.PI/2+Math.PI*2*(own?1:cap/3));ctx.stroke();
  ctx.fillStyle='#ddd';ctx.fillRect(Z.flag.x-2,Z.flag.y-40,4,40);ctx.fillStyle=own?'#3cc48a':TERRS[Z.id].col;ctx.beginPath();ctx.moveTo(Z.flag.x+2,Z.flag.y-40);ctx.lineTo(Z.flag.x+32,Z.flag.y-31);ctx.lineTo(Z.flag.x+2,Z.flag.y-22);ctx.fill();}
 if(Z.door){const pul=1+Math.sin(time*4)*.12;ctx.fillStyle=Z.kind==='heist'?'rgba(224,72,62,.35)':'rgba(232,185,49,.35)';ctx.beginPath();ctx.arc(Z.door.x,Z.door.y-14,26*pul,0,7);ctx.fill();}
 // sombras e prédios
 ctx.fillStyle='rgba(0,0,0,.33)';for(const b of Z.blocks)ctx.fillRect(b.x+10,b.y+12,b.w,b.h);
 for(const t of Z.trees){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.arc(t.x+6,t.y+8,t.r,0,7);ctx.fill();}
 for(const b of Z.blocks){
  ctx.fillStyle=shade(b.col,-.2);ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle=b.col;ctx.fillRect(b.x+5,b.y+5,b.w-10,b.h-10);
  if(b.crate){ctx.strokeStyle=shade(b.col,-.35);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x+b.w,b.y+b.h);ctx.moveTo(b.x+b.w,b.y);ctx.lineTo(b.x,b.y+b.h);ctx.stroke();continue;}
  ctx.fillStyle=shade(b.col,.12);ctx.fillRect(b.x+12,b.y+12,Math.min(26,b.w/4),Math.min(18,b.h/4));
  if(b.w>120)ctx.fillRect(b.x+b.w-40,b.y+b.h-30,22,16);
  if(b.main){
   ctx.fillStyle=shade(b.col,-.3);ctx.fillRect(b.x+b.w/2-40,b.y-4,80,10);
   ctx.font='bold 26px system-ui';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.strokeText(b.label,b.x+b.w/2,b.y+b.h/2+8);ctx.fillStyle='#f4f1e8';ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2+8);
  }
 }
 for(const t of Z.trees){ctx.fillStyle='#2f5a34';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,7);ctx.fill();ctx.fillStyle='#3d7243';ctx.beginPath();ctx.arc(t.x-t.r*.25,t.y-t.r*.25,t.r*.6,0,7);ctx.fill();}
 // entidades
 if(car){drawCar(car,S.carHp>0?C_().col:'#3a3a3a',false);if(S.carHp<=0&&Math.random()<.3)parts.push({x:car.x+rnd(-8,8),y:car.y+rnd(-8,8),vx:rnd(-10,10),vy:-30,life:.8,col:'rgba(60,60,60,.6)',r:6});}
 for(const p of police)drawCar(p,'#e8ecf2',true);
 for(const g of gang)drawPerson(g.x,g.y,g.ang,'#8a4bb8',0);
 if(!P.inCar)drawPerson(P.x,P.y,P.ang,'#36c2b4',P.hurt);
 ctx.strokeStyle='#ffe28a';ctx.lineWidth=2.5;ctx.beginPath();for(const b of bullets){ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.02,b.y-b.vy*.02);}ctx.stroke();
 for(const p of parts){ctx.globalAlpha=clamp(p.life*3,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}ctx.globalAlpha=1;
 // ecrã
 ctx.setTransform(DPR,0,0,DPR,0,0);
 const goal=Z.door?{x:Z.door.x,y:Z.door.y-10}:Z.flag;
 if(goal){const sx=(goal.x-camX)*ZOOM,sy=(goal.y-camY)*ZOOM;if(sx<0||sy<0||sx>W||sy>H){const a=Math.atan2(sy-H/2,sx-W/2),R=Math.min(W,H)*.38;const ax=W/2+Math.cos(a)*R,ay=H/2+Math.sin(a)*R;ctx.save();ctx.translate(ax,ay);ctx.rotate(a);ctx.fillStyle=Z.kind==='heist'?'#e0483e':'#e8b931';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-8,-10);ctx.lineTo(-8,10);ctx.fill();ctx.restore();}}
 if(wanted>0){const on=Math.floor(time*3)%2;const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,on?'rgba(224,60,60,.22)':'rgba(60,110,224,.22)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
 if(joy){ctx.globalAlpha=.5;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(joy.bx,joy.by,60,0,7);ctx.stroke();ctx.fillStyle='#fff';const dx=joy.x-joy.bx,dy=joy.y-joy.by,m=Math.hypot(dx,dy),k=m>60?60/m:1;ctx.beginPath();ctx.arc(joy.bx+dx*k,joy.by+dy*k,24,0,7);ctx.fill();ctx.globalAlpha=1;}
}
function hud(){

 $('#bagtxt').textContent=`Mochila ${invKg().toFixed(1)}/${B_().cap}kg`;
 let s='';for(let i=0;i<5;i++)s+=i<wanted?'<b>★</b>':'★';$('#stars').innerHTML=s;$('#stars').className=wanted&&Math.floor(time*3)%2?'flash':'';

 else if(bust>0){pr.classList.remove('hidden');pr.classList.add('red');pr.querySelector('.lab').textContent='🚔 A SER DETIDO — foge!';pr.querySelector('i').style.width=(bust/2*100)+'%';}
 else if(cap>0){pr.classList.remove('hidden','red');pr.querySelector('.lab').textContent='A tomar território…';pr.querySelector('i').style.width=(cap/3*100)+'%';}

/* ---------- mapa ---------- */
function openMap(){
 mode='map';joy=null;firing=false;
 const A=$('#mapArea');const home=MAPNODES[0];
 let svg='<svg viewBox="0 0 100 100" preserveAspectRatio="none">';
 for(const n of MAPNODES){if(n===home)continue;svg+=`<path d="M${home.x} ${home.y} Q ${(home.x+n.x)/2} ${home.y} ${n.x} ${n.y}" stroke="#555a52" stroke-width=".9" fill="none" vector-effect="non-scaling-stroke" style="stroke-width:5px"/>`;}
 svg+='</svg>';
 let h=svg;
 for(const n of MAPNODES){
  const k=kindOf(n.id),d=defOf(n.id),lvl=d.lvl||1,lock=S.lvl<lvl;let st='',cls='node '+k;
  if(lock){cls+=' lock';st='🔒 Nível '+lvl;}
  else if(k==='heist'){const left=(S.cds[n.id]||0)-Date.now();st=left>0?'Fechado '+mmss(left):'★'.repeat(d.stars)+' disponível';}
  else if(k==='terr'){if(S.terr[n.id]){cls+=' own';st='Teu · '+fmt(d.income)+'/min';}else st='Gangue: '+d.gang;}
  if(S.mission&&!S.mission.done&&S.mission.target===n.id)cls+=' mis';
  if(S.mission&&S.mission.done&&n.id==='bar')cls+=' mis';
  h+=`<button class="${cls}" data-id="${n.id}" style="left:${n.x}%;top:${n.y}%"><span class="ic">${n.ic}</span><span class="nm">${esc(d.name)}</span><span class="st">${st}</span></button>`;
 }
 A.innerHTML=h;
 $('#mapInfo').textContent=incomeRate()>0?`Rendas: +${fmt(incomeRate())}/min`:'';
 $('#map').classList.remove('hidden');
}
$('#mapArea').addEventListener('click',e=>{

function travelFx(fn){const t=$('#travel');t.classList.remove('hidden');t.style.opacity='1';mode='travel';setTimeout(()=>{fn();t.style.opacity='0';setTimeout(()=>t.classList.add('hidden'),300);},450);}

/* ---------- menus ---------- */
let mRender=null,mActs={};
function openMenu(title,render){mode='menu';joy=null;firing=false;$('#mTitle').textContent=title;mRender=render;refreshMenu();$('#modal').classList.remove('hidden');}
function refreshMenu(){mActs={};const h=mRender((k,fn)=>{mActs[k]=fn;return`data-a="${k}"`;});$('#mBody').innerHTML=h;}
$('#mBody').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=mActs[b.dataset.a];if(f){f();save();if(!$('#modal').classList.contains('hidden'))refreshMenu();}});
function closeMenu(){$('#modal').classList.add('hidden');if(mode==='menu')mode='play';save();}
$('#mClose').addEventListener('click',closeMenu);
function groupInv(){const m={};for(const i of S.inv){const k=i.n;if(!m[k])m[k]={n:i.n,c:0,v:0,kg:0,dirty:i.dirty};m[k].c++;m[k].v+=i.v;m[k].kg+=i.kg;}return Object.values(m);}
const sellVal=g=>Math.floor(g.v*(g.dirty?.8:1)*terrBonus());

function openShop(id){
 if(id==='bar')openMenu('🍺 Bar O Farol',menuBar);
 else if(id==='armeiro')openMenu('🔫 Armeiro do Lima',menuArm);
 else if(id==='stand')openMenu('🚗 Stand Rodas Livres',menuStand);
 else if(id==='imob')openMenu("🏠 Imobiliária Chave d'Ouro",menuImob);
 else if(id==='home')openMenu('🏚️ Esconderijo',menuHome);
}
function menuBar(A){
 let h=`<p class="sub">Zé Faísca, a limpar um copo: "Traz-me coisas boas e eu arranjo comprador. Sem perguntas."</p>`;
 const gs=groupInv();
 h+='<h3>Vender saque</h3>';
 if(!gs.length)h+='<p class="dim">A tua mochila está vazia.</p>';
 else{
  let tot=0;
  for(const g of gs){const v=sellVal(g);tot+=v;h+=`<div class="row"><div class="n"><b>${esc(g.n)} ×${g.c}</b><small>${g.kg.toFixed(1)}kg${g.dirty?' · lavagem 80%':''}</small></div><button class="btn" ${A('s_'+g.n,()=>{S.inv=S.inv.filter(i=>i.n!==g.n);addMoney(v);toast('+'+fmt(v),'g');})}>${fmt(v)}</button></div>`;}
  h+=`<button class="btn g big" ${A('sellall',()=>{addMoney(tot);S.inv=[];toast('💵 Vendeste tudo: +'+fmt(tot),'g');})}>Vender tudo · ${fmt(tot)}</button>`;
  if(Object.keys(S.terr).length)h+=`<p class="dim">Bónus de território: +${Math.round((terrBonus()-1)*100)}% no preço</p>`;
 }
 h+='<h3>Contrato</h3>';
 const m=S.mission;
 if(!m){h+=`<p class="dim">O Zé tem sempre trabalho para quem não faz perguntas.</p><button class="btn big" ${A('newm',()=>{const opts=Object.keys(HEISTS).filter(k=>HEISTS[k].lvl<=S.lvl);const t=opts[Math.floor(Math.random()*opts.length)];const hh=HEISTS[t];S.mission={target:t,reward:200+hh.stars*250+S.lvl*60,xp:hh.xp,done:false};toast('📋 Novo contrato: '+hh.name);})}>Pedir contrato</button>`;}
 else if(m.done)h+=`<div class="row"><div class="n"><b>✅ ${esc(HEISTS[m.target].name)}</b><small>Trabalho feito</small></div><button class="btn o" ${A('claim',()=>{addMoney(m.reward);addXP(m.xp);S.mission=null;toast('🤝 Recompensa: +'+fmt(m.reward),'g');})}>Receber ${fmt(m.reward)}</button></div>`;
 else h+=`<div class="row"><div class="n"><b>Assaltar: ${esc(HEISTS[m.target].name)}</b><small>Recompensa ${fmt(m.reward)} + ${m.xp} XP</small></div><button class="btn" ${A('dropm',()=>{S.mission=null;})}>Desistir</button></div>`;
 return h;
}
function buyRow(A,key,it,owned,equipped,sub,onBuy,onEquip){
 let b;
 if(equipped)b=`<button class="btn" disabled>Equipado</button>`;
 else if(owned)b=`<button class="btn o" ${A('e_'+key,onEquip)}>Usar</button>`;
 else if(S.lvl<(it.lvl||1))b=`<button class="btn" disabled>🔒 Nv ${it.lvl}</button>`;
 else b=`<button class="btn g" ${S.money<it.price?'disabled':''} ${A('b_'+key,()=>{if(S.money<it.price)return;S.money-=it.price;onBuy();toast('Compraste '+it.name,'g');})}>${fmt(it.price)}</button>`;
 return`<div class="row"><div class="n"><b>${esc(it.name)}</b><small>${sub}</small></div>${b}</div>`;
}
function menuArm(A){
 let h=`<p class="sub">"Aqui não há recibos." — Lima</p><h3>Armas</h3>`;
 for(const w of WEAPONS)h+=buyRow(A,w.id,w,S.weapons.includes(w.id),S.weapon===w.id,`Dano ${w.dmg}${w.pel>1?'×'+w.pel:''} · cadência ${(1/w.rate).toFixed(1)}/s · alcance ${w.range}`,()=>{S.weapons.push(w.id);S.weapon=w.id;},()=>{S.weapon=w.id;});
 h+='<h3>Sacos</h3>';
 for(const b of BAGS)h+=buyRow(A,b.id,b,S.bags.includes(b.id),S.bag===b.id,`Capacidade ${b.cap}kg`,()=>{S.bags.push(b.id);S.bag=b.id;},()=>{if(invKg()>b.cap){toast('Tens demasiado peso para esse saco','r');return;}S.bag=b.id;});

function menuStand(A){
 let h=`<p class="sub">"Documentos? Vêm no próximo mês." — vendedor</p><h3>Carros</h3>`;
 for(const c of CARS)h+=buyRow(A,c.id,c,S.cars.includes(c.id),S.car===c.id,`${c.d} · vel ${c.spd} · resistência ${c.hp}`,()=>{S.cars.push(c.id);S.car=c.id;S.carHp=c.hp;},()=>{S.car=c.id;S.carHp=c.hp;});
 const miss=C_().hp-S.carHp,cost=Math.ceil(miss*4);
 h+=`<h3>Oficina</h3><div class="row"><div class="n"><b>Reparar ${esc(C_().name)}</b><small>${Math.round(S.carHp)}/${C_().hp}</small></div><button class="btn" ${miss<1||S.money<cost?'disabled':''} ${A('rep',()=>{S.money-=cost;S.carHp=C_().hp;toast('🔧 Carro reparado');})}>${fmt(cost)}</button></div>`;
 return h;

function collectBtn(A){const p=Math.floor(S.pending);return`<button class="btn o big" ${p<1?'disabled':''} ${A('col',()=>{addMoney(p);S.pending-=p;toast('🏦 Rendas recolhidas: +'+fmt(p),'g');})}>Recolher rendas · ${fmt(p)}</button>`;}

/* ---------- login + atualizações ---------- */
$('#ver').textContent='v'+GAME_VERSION;
async function checkUpdate(){
 const el=$('#upd');
 try{
  const r=await fetch((ON_PAGES?'':REMOTE_BASE)+'version.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw 0;const j=await r.json();
  if(cmpVer(j.version,GAME_VERSION)>0){
   if(ON_PAGES){
    let tried='';try{tried=sessionStorage.getItem('golpe_upd')||'';}catch(e){}
    if(tried!==j.version){try{sessionStorage.setItem('golpe_upd',j.version);}catch(e){}
     el.textContent=`⬇️ Nova versão ${j.version} — a instalar…`;
     try{const reg=await navigator.serviceWorker?.getRegistration();if(reg)await reg.update();}catch(e){}
     setTimeout(()=>location.reload(),1200);return;}
    el.textContent=`Nova versão ${j.version} a chegar ao servidor — tenta daqui a 1-2 min.`;return;
   }
   el.innerHTML=`Nova versão ${esc(j.version)} disponível. <a href="${REMOTE_BASE}" target="_blank" rel="noopener">Abrir</a>`;return;
  }
  el.textContent='✓ Jogo atualizado (v'+GAME_VERSION+')';
  const shell=new URLSearchParams(location.search).get('shell');
  if(shell&&j.apk&&cmpVer(j.apk.version,shell)>0)el.innerHTML+=`<br><a href="${esc(j.apk.url)}">📲 Nova app ${esc(j.apk.version)} — descarregar</a>`;
  if(j.notes&&j.notes.length)el.title=j.notes.join('\n');
 }catch(e){el.textContent='Modo offline (v'+GAME_VERSION+')';}
}
if('serviceWorker' in navigator&&ON_PAGES){navigator.serviceWorker.register('sw.js').catch(()=>{});}
load();
{const el=Date.now()-(S.last||Date.now());const r=incomeRate();if(r>0&&el>60000){const add=r*Math.min(el,8*3600e3)/60000;S.pending+=add;setTimeout(()=>toast(`🏦 Enquanto estiveste fora: +${fmt(add)} em rendas por recolher`,'g'),800);}}
$('#nick').value=S.nick||'';
checkUpdate();

 travelFx(()=>{enterZone('home');toast(`Bem-vindo a Vila Rubra, ${S.nick}. Sai pela estrada para abrir o mapa.`);});
});
setInterval(()=>{if(mode==='play'||mode==='menu'||mode==='map')save();},5000);
addEventListener('visibilitychange',()=>{if(document.hidden)save();});

requestAnimationFrame(loop);
window.__golpe={S:()=>S,P,enterZone,openMap,get mode(){return mode;},get wanted(){return wanted;},set wanted(v){wanted=v;},finishHeist,startHeist,get Z(){return Z;},update};
})();
