name: GOLPE — personagens realistas (MPFB2, CC0)

on:
  workflow_dispatch:
  push:
    paths:
      - tools/mpfb_*.py
      - .github/workflows/chars.yml

permissions:
  contents: write

jobs:
  chars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Blender 4.2 LTS
        run: |
          wget -q https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf blender-4.2.3-linux-x64.tar.xz
          echo "$PWD/blender-4.2.3-linux-x64" >> $GITHUB_PATH
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 > /dev/null
      - name: Cache dos pacotes MakeHuman
        uses: actions/cache@v4
        with:
          path: ~/mhpacks
          key: mhpacks-v1
      - name: MPFB2 + pacotes de recursos CC0
        run: |
          timeout 1500 python3 -u - <<'PY'
          import re, urllib.request
          UA={"User-Agent":"GOLPE/1.0"}
          def get(u): return urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=120).read()
          # extensão MPFB do repositório oficial de extensões do Blender
          page=get("https://extensions.blender.org/add-ons/mpfb/").decode()
          links=sorted(set(re.findall(r'href="([^"]+\.zip[^"]*)"',page)))
          print("links mpfb:",links[:10])
          url=[l for l in links if "download" in l or l.endswith(".zip")][0]
          if url.startswith("/"): url="https://extensions.blender.org"+url
          open("mpfb.zip","wb").write(get(url))
          import zipfile, io, os
          dest=os.path.expanduser("~/.config/blender/4.2/extensions/.user/user_default/mpfb/data")
          os.makedirs(dest, exist_ok=True)
          base="https://static.makehumancommunity.org/assets/assetpacks/"
          for pk in ["makehuman_system_assets","shirts01","pants01","shoes01","hats01","masks01","suits01","hair01","skins01"]:
              try:
                  html=get(base+pk+".html").decode()
                  z=[l for l in re.findall(r'href="([^"]+\.zip)"',html)]
                  if not z: print("sem zip",pk); continue
                  u=z[0] if z[0].startswith("http") else base+z[0]
                  cp=os.path.expanduser("~/mhpacks/"+pk+".zip"); os.makedirs(os.path.dirname(cp),exist_ok=True)
                  if os.path.exists(cp): data=open(cp,"rb").read()
                  else:
                      print("a descarregar",pk,u,flush=True); data=get(u); open(cp,"wb").write(data)
                  zf=zipfile.ZipFile(io.BytesIO(data))
                  names=zf.namelist(); print(pk, len(data)//1024, "KB", names[:3])
                  zf.extractall(dest)
              except Exception as e:
                  print("falhou",pk,e)
          PY
          blender -b --command extension install-file -r user_default -e mpfb.zip || true
          ls ~/.config/blender/4.2/extensions/user_default/ || true
      - name: Gerar personagens
        run: |
          blender -b --python tools/mpfb_gen.py -- jogo/game/chars/AnimationLibrary_Godot_Standard.gltf jogo/assets/ext/chars tools/mpfb_specs.json 2>&1 | grep -E "GEN|Error|error|Traceback|File \"" | head -200
          ls -la jogo/assets/ext/chars || true
      - name: Guardar
        run: |
          git config user.name "golpe-bot"
          git config user.email "golpe-bot@users.noreply.github.com"
          git add jogo/assets/ext/chars || true
          git commit -m "Personagens MPFB2 gerados" || echo "nada"
          git pull --rebase -q origin main && git push -q origin HEAD:main
